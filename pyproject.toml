[project]
name = "prc-fuel-burn-2025"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery[pandas]>=3.45.2",
    "google-cloud-storage>=3.15.0",
    "openap>=2.6.2",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prc_fuel"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
